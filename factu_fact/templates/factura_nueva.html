{% extends "base.html" %}
{% block title %}Factu Fact - Nueva Factura{% endblock %}
{% block content %}
    <h2>Crear Nueva Factura</h2>
    <form action="{{ url_for('factura_nueva') }}" method="post">
        <label for="nombre_cliente">Nombre del Cliente:</label>
        <input type="text" id="nombre_cliente" name="nombre_cliente" required>

        <label for="cedula_cliente">Cédula del Cliente:</label>
        <input type="text" id="cedula_cliente" name="cedula_cliente" required>

        <label for="empresa">Empresa:</label>
        <input type="text" id="empresa" name="empresa" placeholder="{{ usuario_actual.nombre }}">

        <label for="productos">Productos / Servicios:</label>
        <textarea id="productos" name="productos" rows="4" required></textarea>

        <label for="total">Total:</label>
        <input type="number" id="total" name="total" min="0" step="0.01" required>

        <button type="submit">Crear Factura</button>
    </form>
{% endblock %}
